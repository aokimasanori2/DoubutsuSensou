name: Build and distribute to Pixel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_APP_ID: '1:34404720470:android:65e0010cc99f3189a080f7'
  FIREBASE_TESTERS: 'aokimasanori@gmail.com'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set increasing test build number
        run: echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Prepare fixed test signing key
        if: github.event_name != 'pull_request'
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.CI_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TEST_KEYSTORE_BASE64" ]; then
            echo '::error::CI_DEBUG_KEYSTORE_BASE64 is not configured.'
            exit 1
          fi
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/doubutsu-debug.keystore"
          echo "CI_DEBUG_KEYSTORE=$RUNNER_TEMP/doubutsu-debug.keystore" >> "$GITHUB_ENV"
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :game:test :app:testDebugUnitTest :app:lintDebug --console=plain
      - uses: actions/upload-artifact@v5
        with:
          name: DoubutsuSensou-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            game/build/reports/
      - uses: actions/setup-node@v5
        if: github.event_name != 'pull_request'
        with:
          node-version: '22'
      - name: Distribute to Firebase App Distribution
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::FIREBASE_SERVICE_ACCOUNT_JSON is not configured.'
            exit 1
          fi
          trap 'rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/doubutsu-debug.keystore"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          {
            git log -1 --pretty=%s
            echo "どうぶつ戦争 0.1.0 / build $APP_VERSION_CODE"
            echo "commit ${GITHUB_SHA::7}"
          } > "$RUNNER_TEMP/release-notes.txt"
          npx --yes firebase-tools@15 appdistribution:distribute \
            app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "$FIREBASE_TESTERS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
